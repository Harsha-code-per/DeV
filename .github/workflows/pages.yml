name: pages

# Serves the website, plus the installers at https://trydev.work/install and /install.ps1.
on:
  push:
    branches: [main]
    paths: [install, install.ps1, website/**, packages/core/src/v1/config/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages needs a public repo on the free plan; DeV stays private until v1.0.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir site && cp install install.ps1 website/* site/
      - uses: ./.github/actions/setup-bun
      # JSON schemas for dev.json and tui.json, so editors can autocomplete settings.
      - run: mkdir -p ../../site/schema && bun script/schema.ts ../../site/schema/config.json ../../site/schema/tui.json
        working-directory: packages/devcode
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
