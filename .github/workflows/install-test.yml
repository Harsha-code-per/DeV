name: install-test

# Runs the real installers on clean machines, the way a user does, then opens a new shell and runs
# devcode from PATH. Also runs when an installer changes, against the latest release.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [install, install.ps1, .github/workflows/install-test.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v1.0.0 (the latest release when empty)

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: devcode-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: devcode-linux-arm64 }
          - { os: macos-latest, asset: devcode-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release to test
        run: echo "TAG=${TAG:-$(gh release view --json tagName -q .tagName)}" >> "$GITHUB_ENV"
      - name: Install zsh and fish, so every startup file is written
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish >/dev/null; else brew install -q fish; fi
          touch ~/.zshrc ~/.bashrc
      - name: Install
        run: sh ./install "$TAG"
      - name: devcode works in a new bash, zsh and fish
        run: |
          for shell in bash zsh fish; do
            got=$($shell -ic 'devcode --version' 2>/dev/null | tail -1)
            echo "$shell: $got"
            test "$got" = "${TAG#v}"
          done
      - name: Installing again changes no startup file
        run: |
          cat ~/.bashrc ~/.zshrc ~/.config/fish/conf.d/devcode.fish > before
          sh ./install "$TAG" > /dev/null
          cat ~/.bashrc ~/.zshrc ~/.config/fish/conf.d/devcode.fish | diff before -
      - name: Runs
        run: |
          export PATH="$HOME/.devcode/bin:$PATH"
          devcode --help > /dev/null
          devcode models < /dev/null > /dev/null
      - name: A tampered archive fails the checksum
        run: |
          gh release download "$TAG" -p "${{ matrix.asset }}.tar.gz" -p SHA256SUMS
          echo x >> "${{ matrix.asset }}.tar.gz"
          ! grep " ${{ matrix.asset }}.tar.gz$" SHA256SUMS | shasum -a 256 -c -

  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release to test
        run: echo "TAG=${TAG:-$(gh release view --json tagName -q .tagName)}" >> "$GITHUB_ENV"
      - name: Installs and runs on a bare Alpine
        run: |
          docker run --rm -e TAG -v "$PWD/install:/install:ro" alpine:3.20 sh -c \
            'apk add -q curl && sh /install "$TAG" && sh -lc "devcode --version"' | tee out.txt
          test "$(tail -1 out.txt)" = "${TAG#v}"

  # The .deb and .rpm from the packages workflow, installed the way the website says.
  linux-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", install: "apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && curl -fsSLo /tmp/devcode.deb $BASE/devcode-linux-x64.deb && apt-get install -y -qq /tmp/devcode.deb >/dev/null" }
          - { image: "debian:12", install: "apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && curl -fsSLo /tmp/devcode.deb $BASE/devcode-linux-x64.deb && apt-get install -y -qq /tmp/devcode.deb >/dev/null" }
          - { image: "fedora:latest", install: "dnf install -y -q $BASE/devcode-linux-x64.rpm" }
    runs-on: ubuntu-latest
    steps:
      - name: Release to test
        run: echo "TAG=${TAG:-$(gh release view --json tagName -q .tagName)}" >> "$GITHUB_ENV"
      - name: Installs and runs on ${{ matrix.image }}
        run: |
          docker run --rm -e BASE="https://github.com/$GH_REPO/releases/download/$TAG" ${{ matrix.image }} sh -c \
            '${{ matrix.install }} && devcode --version && devcode upgrade' 2>&1 | tee out.txt
          grep -qx "${TAG#v}" out.txt
          grep -q "package manager" out.txt

  scoop:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Release to test
        run: |
          $tag = if ($env:TAG) { $env:TAG } else { gh release view --json tagName -q .tagName }
          "TAG=$tag" >> $env:GITHUB_ENV
      - name: Installs with Scoop
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          $env:Path = "$HOME\scoop\shims;$env:Path"
          scoop install "https://github.com/$env:GH_REPO/releases/download/$env:TAG/devcode.json"
          $version = (devcode --version).Trim()
          if ($version -ne $env:TAG.TrimStart('v')) { throw "got $version" }

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release to test
        run: |
          $tag = if ($env:TAG) { $env:TAG } else { gh release view --json tagName -q .tagName }
          "TAG=$tag" >> $env:GITHUB_ENV
      - name: Install, and run in the same window
        run: |
          ./install.ps1 $env:TAG
          $version = (devcode --version).Trim()
          if ($version -ne $env:TAG.TrimStart('v')) { throw "got $version" }
          devcode --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "help failed" }
      - name: devcode is on the PATH of new windows
        run: |
          $dir = Join-Path $HOME ".devcode\bin"
          $path = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($path -split ';') -notcontains $dir) { throw "PATH has no $dir" }
