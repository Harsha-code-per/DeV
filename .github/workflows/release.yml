name: release

on:
  push:
    tags: ["v*"]
  # Publishes an existing release to npm, for a tag whose npm step failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to npm, such as v1.0.3
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    if: github.event_name == 'push'
    # One macOS runner cross-compiles every target (script/build.ts), and it is the only place
    # the darwin binaries can be re-signed after embedding, which macOS requires.
    runs-on: macos-latest
    permissions:
      contents: write
      actions: write # starts the packages workflow on the new release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Version from tag
        run: echo "DEV_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # linux x64/arm64 (glibc, musl, x64 baseline), darwin x64/arm64, windows x64/arm64.
      - name: Build
        run: bun run script/build.ts
        working-directory: packages/devcode

      - name: Archives, SHA256SUMS, Homebrew formula, Scoop manifest
        run: bun script/packaging.ts "$DEV_VERSION"

      - name: GitHub Release
        run: |
          prerelease=""
          case "$DEV_VERSION" in *-*) prerelease="--prerelease" ;; esac
          # The notes are this version's CHANGELOG section, written for users, not the commit list.
          awk -v v="$DEV_VERSION" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "$GITHUB_REF_NAME" dist/release/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease

      # A release made with the workflow token starts no other workflow by itself. The packages
      # workflow builds the Linux packages and then starts install-test on clean machines.
      - name: Linux packages, then the install test
        run: gh workflow run packages.yml --repo "$GITHUB_REPOSITORY" -f tag="$GITHUB_REF_NAME"

  # npm: the SDK and plugin SDK for plugin authors, then one small launcher package that downloads
  # the GitHub release. npm signs in through trusted publishing (no stored token), which with its
  # provenance needs a public repository. Pre-releases stay on GitHub only.
  npm:
    needs: release
    if: >-
      ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
      && !github.event.repository.private && vars.NPM_PUBLISH == 'true'
      && !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Publish
        working-directory: packages/devcode
        run: |
          export DEV_VERSION="${TAG#v}"
          npm install -g npm@11
          # Skips what is already published, so a failed run can simply be repeated.
          published() { [ "$(npm view "@devcodeagent/$1@$DEV_VERSION" version 2>/dev/null)" = "$DEV_VERSION" ]; }
          published sdk || (cd ../sdk/js && bun script/build.ts && bun script/publish.ts)
          published plugin || (cd ../plugin && bun script/publish.ts)
          published cli || bun script/publish.ts
