name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    # One macOS runner cross-compiles every target (script/build.ts), and it is the only place
    # the darwin binaries can be re-signed after embedding, which macOS requires.
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Version from tag
        run: echo "DEV_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # linux x64/arm64 (glibc, musl, x64 baseline), darwin x64/arm64, windows x64/arm64.
      - name: Build
        run: bun run script/build.ts
        working-directory: packages/devcode

      - name: Archives, SHA256SUMS, Homebrew formula, Scoop manifest
        run: bun script/packaging.ts "$DEV_VERSION"

      - name: GitHub Release
        run: |
          prerelease=""
          case "$DEV_VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/release/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease

      # npm: the SDK and plugin SDK for plugin authors, then one small launcher package. npm signs in through trusted publishing, so no token is stored;
      # that and its provenance need a public repository. Pre-releases stay on GitHub only.
      - name: npm publish
        # Set the repository variable NPM_PUBLISH to true once npm trusts this workflow.
        if: ${{ !github.event.repository.private && !contains(github.ref_name, '-') && vars.NPM_PUBLISH == 'true' }}
        run: |
          npm install -g npm@11
          (cd ../sdk/js && bun script/build.ts && bun script/publish.ts)
          (cd ../plugin && bun script/publish.ts)
          bun script/publish.ts
        working-directory: packages/devcode
