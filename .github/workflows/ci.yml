name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun turbo typecheck --concurrency=1
      - run: bun script/brand-check.ts --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - app
          - client
          - codemode
          - core
          - devcode
          - effect-drizzle-sqlite
          - http-recorder
          - httpapi-codegen
          - llm
          - sdk-next
          - sdk/js
          - session-ui
          - tui
          - ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Tests make throwaway git repositories and commit to them.
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: bun run test
        working-directory: packages/${{ matrix.package }}

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: shellcheck install # preinstalled on ubuntu runners
      # The root bunfig refuses tests from the repo root, so run them from script/.
      - run: bun test install.test.ts
        working-directory: script

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      # Full history; reviewed false positives are listed in .gitleaksignore.
      - run: ./gitleaks git --redact --no-banner --exit-code 1 .
