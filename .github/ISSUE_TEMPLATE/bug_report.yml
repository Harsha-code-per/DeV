name: Bug report
description: Something in DeV does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `devcode` in ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DeV version
      description: Output of `devcode --version`, or the commit you built from.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Arch Linux x64, macOS 15 arm64, Windows 11
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider and model
      placeholder: e.g. auto/free, ollama/qwen3, groq/...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove keys, tokens and anything private first.
