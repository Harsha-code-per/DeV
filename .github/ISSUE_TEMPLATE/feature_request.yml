name: Feature request
description: Suggest something DeV should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like DeV to do. If Claude Code or another tool already does this, say how.
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and docs/ROADMAP.md, and this is not already there.
          required: true
